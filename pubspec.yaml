name: ipot_qr_ordering
description: IPOT Customer QR Ordering App
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # Navigation
  go_router: ^13.2.0

  # HTTP
  dio: ^5.4.1

  # Dependency injection
  get_it: ^7.6.7

  # Models — freezed 3.x uses build ^4.0.0, compatible with build_runner 2.7+
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # QR Scanner
  mobile_scanner: ^6.0.0

  # Local storage
  hive_flutter: ^1.1.0

  # Utils
  intl: ^0.19.0
  uuid: ^4.5.1
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  freezed: ^3.0.0
  json_serializable: ^6.8.0
  bloc_test: ^9.1.5
  mocktail: ^1.0.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
